<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Sign in to Euodoo To Do List account. Enter your email, employee ID, and password to access your tasks."
    />
    <title>Sign In - Euodoo To Do List</title>
    <link rel="stylesheet" href="css/login.css" />
  </head>
  <body>
    <main class="login-page">
      <section class="login-card" aria-labelledby="page-title">
        <!-- Top Branding Section -->
        <div class="logo-section">
          <div class="logo-box" aria-hidden="true">
            <span class="logo-letter">E</span>
          </div>
          <div class="category-pill">
            <span>To Do List</span>
          </div>
        </div>

        <!-- Main Heading -->
        <h1 id="page-title" class="page-heading">Sign In</h1>

        <!-- Authentication Form -->
        <form id="login-form" class="login-form" novalidate autocomplete="on">
          <!-- 1. Email Field -->
          <div class="form-group">
            <label for="email" class="form-label">
              Email <span class="required-star" aria-hidden="true">*</span>
            </label>
            <input
              type="email"
              id="email"
              name="email"
              class="form-input"
              value=""
              placeholder="employee@euodootech.com"
              autocomplete="email"
            />
            <p id="email-error" class="error-message" role="alert"></p>
          </div>

          <!-- 2. Employee ID Field -->
          <div class="form-group">
            <label for="employee-id" class="form-label">
              Employee ID
              <span class="required-star" aria-hidden="true">*</span>
            </label>
            <input
              type="text"
              id="employee-id"
              name="employee_id"
              class="form-input"
              value=""
              placeholder="ETAXXXX"
              autocomplete="username"
            />
            <p id="employee-id-error" class="error-message" role="alert"></p>
          </div>

          <!-- 3. Password Field with JavaScript Show/Hide Toggle -->
          <div class="form-group password-group">
            <label for="password" class="form-label">
              Password <span class="required-star" aria-hidden="true">*</span>
            </label>
            <div class="password-input-wrapper">
              <input
                type="password"
                id="password"
                name="password"
                class="form-input password-input"
                value=""
                placeholder="Enter your password"
                autocomplete="current-password"
              />
              <button
                type="button"
                id="password-toggle-btn"
                class="password-toggle-btn"
                aria-label="Toggle password visibility"
                title="Toggle password visibility"
              >
                <!-- Eye Open Icon (shown initially when password is masked) -->
                <svg
                  id="eye-open-icon"
                  class="eye-icon"
                  xmlns="http://www.w3.org/2000/svg"
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
                <!-- Eye Closed / Cross Icon (shown when password is text) -->
                <svg
                  id="eye-closed-icon"
                  class="eye-icon"
                  style="display: none"
                  xmlns="http://www.w3.org/2000/svg"
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24" />
                  <path
                    d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"
                  />
                  <path
                    d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"
                  />
                  <line x1="2" y1="2" x2="22" y2="22" />
                </svg>
              </button>
            </div>
            <p id="password-error" class="error-message" role="alert"></p>
          </div>

          <!-- Forgot Password Link -->
          <div class="forgot-password-wrapper">
            <a
              href="#forgot-password"
              class="forgot-password-link"
              id="forgot-password-link"
            >
              Forgot your password?
            </a>
          </div>

          <!-- Sign In Submit Button -->
          <button type="submit" class="submit-btn" id="signin-button">
            Sign in
          </button>
        </form>
      </section>
    </main>

    <script src="js/login.js"></script>
  </body>
</html>
